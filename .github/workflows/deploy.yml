name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker Hub namespace = your username (repo variable). Docker Hub repo names must be lowercase.
  IMAGE_NS: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/eng-voice-backend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/eng-voice-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/eng-voice-frontend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/eng-voice-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
