# Edge nginx at 113.190.235.211 (the one with origin.pem). Same layout as your hermes site.
server {
    listen 80;
    listen [::]:80;
    server_name eng.ntuanvu89.id.vn;
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eng.ntuanvu89.id.vn;
    ssl_certificate /etc/nginx/ssl/ntuanvu89.id.vn/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/ntuanvu89.id.vn/origin.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://192.168.2.61:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
